name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  numba-equivalence:
    name: Numba backend equivalence / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development and Numba dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,numba]"
      - name: Run backend guardrails
        run: python -m pytest tests/test_flowfield_backend_guardrails.py tests/test_vertical_numba.py -q

  smoke-tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Run tests with coverage
        run: python -m pytest --cov=ldsfl --cov-report=term-missing --cov-report=xml

      - name: Build source and wheel distributions
        if: ${{ matrix.python-version == '3.12' }}
        run: python -m build

      - name: Check distribution metadata
        if: ${{ matrix.python-version == '3.12' }}
        run: python -m twine check dist/*

      - name: Verify wheel CLI entry point
        if: ${{ matrix.python-version == '3.12' }}
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          ldsfl-run --help

      - name: Upload distributions
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml
